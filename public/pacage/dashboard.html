<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amarillo Bank | Mi Cuenta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:#F6F7F9">
    <header class="navbar">
        <div class="logo">amarillo<span>bank</span></div>
        <a href="index.html" class="btn-login">Salir</a>
    </header>
    <main class="container">
        <section class="card-principal">
            <div><h2>Hola, Juan 👋</h2><p style="opacity:0.7;font-size:14px;margin-top:5px">Cuenta de Ahorros *1001</p></div>
            <div class="saldo"><span style="font-size:13px;opacity:0.7">Saldo disponible</span><h1 id="saldoTotal">$ 500.000</h1></div>
            <div class="acciones">
                <button class="accion-btn">↑ Transferir</button>
                <button class="accion-btn">↓ Consignar</button>
                <button class="accion-btn">↻ Retirar</button>
            </div>
        </section>
        <section class="panel">
            <h3>Movimientos</h3>
            <div class="form-operacion" style="margin-top:15px">
                <input type="text" id="numeroCuenta" placeholder="Número de cuenta">
                <input type="number" id="monto" placeholder="Monto $">
                <div class="botones-grid">
                    <button id="btnConsignar" class="btn-aqua" style="padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer">Consignar</button>
                    <button id="btnRetirar" class="btn-dark" style="padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer">Retirar</button>
                </div>
                <button id="btnTransferir" class="btn-morado-full">Transferir a otra cuenta</button>
            </div>
            <ul id="listaMovimientos" style="list-style:none;margin-top:20px"></ul>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
