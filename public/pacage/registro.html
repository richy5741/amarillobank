<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amarillo Bank | Crear cuenta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <a href="index.html" class="back">← Volver al inicio</a>
        <div class="login-card" style="width:420px">
            <div class="logo" style="margin-bottom:15px;font-size:26px">amarillo<span>bank</span></div>
            <h2>Crea tu cuenta gratis</h2>
            <p>Toma menos de 5 minutos</p>
            
            <input type="text" id="cedula" placeholder="Cédula">
            <input type="text" id="nombre" placeholder="Nombre completo">
            <input type="text" id="celular" placeholder="Número celular">
            <input type="email" id="correo" placeholder="Correo electrónico">
            <input type="password" id="clave" placeholder="Crea tu clave">
            <input type="password" id="clave2" placeholder="Confirma tu clave">

            <button id="btnCrear" class="btn-morado-full">Crear mi cuenta</button>
            <span class="link" onclick="location.href='login.html'">¿Ya tienes cuenta? Entra aquí</span>
        </div>
    </div>
    <script type="module" src="../../main.js"></script>
</body>
</html>
